services:

  fastapi:
    build:
      context: ./server/fastapi
      dockerfile: Dockerfile
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", '--reload' ]
    env_file:
      - ./server/fastapi/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server/fastapi:/app

  laravel:
    build:
      context: ./server/laravel
      dockerfile: Dockerfile
    env_file:
      - ./server/laravel/.env
    ports:
      - "8001:80"
    volumes:
      - ./server/laravel:/var/www/elpis-laravel

  prototype:
    build:
      context: ./clients/prototype
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  db:
    image: postgres:10.23-alpine
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: elpis
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready", "-d elpis", "-U dev" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db-data: